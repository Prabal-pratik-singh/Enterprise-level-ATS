server:
  port: 8080

spring:
  application:
    name: api-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ats}
    username: ${DB_USER:ats}
    password: ${DB_PASSWORD:ats}
  jpa:
    # Flyway owns the schema; Hibernate never generates or validates DDL
    hibernate:
      ddl-auto: none
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # api-service consumes application.scored for SSE pushes (group id and
      # offset policy live on the listener annotation — see ScoredEventsListener)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

server.error.include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  # Part 2 C1: sign-in. JWT_SECRET signs the access tokens — the API refuses to start without it.
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    cookie-secure: false   # the demo is plain http://localhost — set true behind HTTPS
    recruiter-email: ${RECRUITER_EMAIL:}
    recruiter-password: ${RECRUITER_PASSWORD:}
  # Phase 8 rerank — the same provider switch the extractor uses
  llm:
    provider: ${LLM_PROVIDER:ollama}
    connect-timeout-seconds: 5
    read-timeout-seconds: ${LLM_READ_TIMEOUT_SECONDS:60}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11435}
      model: ${OLLAMA_MODEL:qwen2.5:3b}
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:openai/gpt-oss-20b}
      fallback-model: ${GROQ_FALLBACK_MODEL:openai/gpt-oss-120b}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:resumes}
  # Phase 7 hybrid search. Both are optional at runtime: without OpenSearch the search
  # endpoint answers 503, without Ollama it answers keyword-only — the rest of the API is unaffected.
  search:
    base-url: ${OPENSEARCH_URL:http://localhost:9200}
    connect-timeout-seconds: 5
    read-timeout-seconds: 10
  embedding:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11435}
    model: ${EMBEDDING_MODEL:nomic-embed-text}
    keep-alive: ${EMBEDDING_KEEP_ALIVE:24h}   # keep the model loaded — a cold reload took 4.1s
    connect-timeout-seconds: 5
    read-timeout-seconds: 10
