# Same contract as the Vite dev proxy: the browser talks to ONE origin
# (localhost:5174) and /api is forwarded to api-service inside the network.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Look "api" up on every request via Docker's DNS (127.0.0.11) instead of once
    # at startup — otherwise nginx refuses to start whenever api isn't up yet.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8080;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        # SSE (live updates): keep the stream open and unbuffered
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        client_max_body_size 20m;
    }

    # React Router: /candidates?app=... etc. are client-side routes -> serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a content hash in asset file names, so they can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
